name: Android APK

# يبني ملف APK لتطبيق سند وينشره كـ Release ثابت الرابط:
# https://github.com/<owner>/<repo>/releases/latest/download/sanad.apk
on:
  push:
    branches: [main, claude/marhaba-nic1hv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle and sync into Android project
        run: npm run build:mobile
        env:
          # اختياري: رابط خادم المدرب الذكي (مثلاً نشر Vercel). بدونه يشتغل المدرب المحلي.
          NEXT_PUBLIC_API_BASE: ${{ vars.SANAD_API_BASE }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Use release keystore from secrets (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sanad.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs sanad.apk | head -3
          ls -lh sanad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sanad-apk
          path: sanad.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: سند — أندرويد (بناء ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: sanad.apk
          body: |
            حمّل `sanad.apk` وثبّته على جوالك (اسمح بالتثبيت من مصادر غير معروفة).
            كل نسخة جديدة تتثبت فوق القديمة وتحافظ على بياناتك.

            Commit: ${{ github.sha }}
