name: Android APK

# يبني تطبيق سند الأصلي (Kotlin + Jetpack Compose)، ينشر APK برابط ثابت:
# https://github.com/<owner>/<repo>/releases/latest/download/sanad.apk
# ثم يشغّله على محاكي أندرويد ويرفق لقطات كل الشاشات بنفس الإصدار.
on:
  push:
    branches: [main, claude/marhaba-nic1hv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      tag: android-build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core logic tests (Kotlin/JVM)
        working-directory: android/core
        run: ./gradlew --no-daemon test

      - name: Use release keystore from secrets (if configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release + debug APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # المدرب السحابي: متغيّر المستودع SANAD_API_URL وسرّ SANAD_APP_KEY (فارغين = بدون سحابة)
          SANAD_API_URL: ${{ vars.SANAD_API_URL }}
          SANAD_APP_KEY: ${{ secrets.SANAD_APP_KEY }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sanad.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sanad-debug.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs sanad.apk | head -3
          ls -lh sanad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            sanad.apk
            sanad-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: سند — أندرويد (بناء ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: sanad.apk
          body: |
            حمّل `sanad.apk` وثبّته على جوالك (اسمح بالتثبيت من مصادر غير معروفة).
            كل نسخة جديدة تتثبت فوق القديمة وتحافظ على بياناتك.

            Commit: ${{ github.sha }}

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/screens.sh sanad-debug.apk screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens

      - name: Attach screenshots to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: screens/*.png

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
